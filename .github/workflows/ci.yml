name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; elevate per job only if a job needs it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Lets the Postgres store tests run instead of skipping. Throwaway database, test only.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forgeline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORGELINE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/forgeline_test
    steps:
      # Pinned to a full commit SHA (actions/checkout v7.0.1), not a mutable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The runner image ships Go, and go.mod's version triggers a matching toolchain
      # download. TODO: add actions/setup-go pinned to a verified commit SHA.
      - run: make ci
      # The console stylesheet is generated; fail if the committed one is out of date.
      - run: make css-check
      # The docs site's sync (docs/ to Starlight) has no dependencies, so its tests run without npm.
      - run: node --test site/scripts/sync.test.mjs
      # The installer must keep working from a clone: syntax, a build into a temporary directory, and the binary runs.
      - run: sh -n install.sh && ./install.sh --source --dir "$RUNNER_TEMP/forgeline-install" --no-start && "$RUNNER_TEMP/forgeline-install/bin/forgeline" version
